apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: '${SERVICE_NAME}'
    spec:
      selector:
        matchLabels:
          app: '${SERVICE_NAME}'
      serviceName: '${SERVICE_NAME}'
      replicas: 1
      template:
        metadata:
          labels:
            app: '${SERVICE_NAME}'
        spec:
          containers:
            - image: '${IMAGE}'
              name: '${SERVICE_NAME}'
              args:
                - '--set'
                - 'receivers.otlp.protocols.http.endpoint=0.0.0.0:${INTERNAL_PORT}'
                - '--set'
                - 'receivers.otlp.protocols.grpc.endpoint=0.0.0.0:4317'
              ports:
                - containerPort: ${TRACE_PORT}
                  protocol: TCP
                - containerPort: ${INTERNAL_PORT}
                  protocol: TCP
                - containerPort: 4317
                  protocol: TCP
      triggers:
        - type: ConfigChange
  - apiVersion: v1
    kind: Service
    metadata:
      name: '${SERVICE_NAME}-query'
      labels:
        app: '${SERVICE_NAME}'
    spec:
      ports:
        - name: query-http
          port: ${TRACE_PORT}
          protocol: TCP
          targetPort: ${TRACE_PORT}
      selector:
        app: '${SERVICE_NAME}'
  - apiVersion: v1
    kind: Service
    metadata:
      name: '${SERVICE_NAME}-collector'
      labels:
        app: '${SERVICE_NAME}'
    spec:
      ports:
        - name: '${SERVICE_NAME}-collector'
          port: ${INTERNAL_PORT}
          protocol: TCP
          targetPort: ${INTERNAL_PORT}
      selector:
        app: '${SERVICE_NAME}'
