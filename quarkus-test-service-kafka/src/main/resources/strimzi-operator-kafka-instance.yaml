# Based on https://github.com/strimzi/strimzi-kafka-operator/blob/release-0.46.x/examples/kafka/kafka-single-node.yaml
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: kafka-instance
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    # Using the ephemeral as some of OCP cluster don't have storage class which can cause node pool failure on startup
    type: ephemeral
---

apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-instance
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    # When updating this version please run the OperatorOpenShiftAmqStreamsKafkaStreamIT in TS
    # as the amq-streams are different from the latest operator
    version: 4.1.0
    replicas: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
