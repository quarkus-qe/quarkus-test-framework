name: "Build Quarkus SNAPSHOT"
on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'
jobs:
  build-quarkus:
    name: Build Quarkus
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 21 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim Disk Space
        run: .github/ci-prerequisites.sh
      - name: Install JDK {{ matrix.java }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          check-latest: true
      - name: Install xsltproc
        run: sudo apt install -qq -y xsltproc
      - name: Initialize Repository Path
        run: |
          # Save local repo to GH ENV to ensure that it's the same in all steps
          mkdir -p maven-repository
          echo "LOCAL_REPO=$(pwd)/maven-repository" >> $GITHUB_ENV
      - name: Build Quarkus core
        run: |
          git clone https://github.com/quarkusio/quarkus.git && cd quarkus && ./mvnw -B --no-transfer-progress -s .github/mvn-settings.xml clean install -Dquickly -Dno-test-modules -Prelocations -Dmaven.repo.local=${{ env.LOCAL_REPO }}
      - name: Build Quarkus Platform
        run: |
          git clone https://github.com/quarkusio/quarkus-platform.git && cd quarkus-platform
          # TODO remove versions:set when moved to testing 999-SNAPSHOT (Quarkus 4)
          ./mvnw versions:set -DnewVersion=999-core-main-SNAPSHOT -Dmaven.repo.local=${{ env.LOCAL_REPO }} -DgenerateBackupPoms=false
          wget -O minimise_platform.xsl "https://github.com/quarkus-qe/quarkus-test-suite/raw/refs/heads/main/.github/minimise_platform.xsl"
          xsltproc -o pom.xml minimise_platform.xsl pom.xml
          ./mvnw -Dsync  -Dquarkus.version=999-SNAPSHOT -Dmaven.repo.local=${{ env.LOCAL_REPO }}
          ./mvnw install -Dquarkus.version=999-SNAPSHOT -DskipTests -DskipITs -Dmaven.repo.local=${{ env.LOCAL_REPO }}
      - name: Cache Build Outputs
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Keep same path ./action/cache-quarkus/action
          path: |
            maven-repository
          key: quarkus-daily-build-${{ github.run_id }}
